root: ./

structure:
  readme: README.md
  summary: SUMMARY.md

variables:
  version: "2.0"

plugins:
  - theme-default
  - search
  - sharing
  - code
  - copy-code-button
  - back-to-top-button

pluginsConfig:
  theme-default:
    showLevel: true
  sharing:
    facebook: true
    twitter: true
    all: ["facebook", "twitter"]
  fontsettings:
    theme: white
    family: sans
    size: 2

